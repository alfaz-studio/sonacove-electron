name: CI / Electron

# Cheap PR quality gate. The expensive Windows/macOS staging builds are now
# manual (`/build` — see staging.yml), so this lightweight Linux lint runs on
# every PR to keep a fast merge check in place. eslint doesn't need the native
# @jitsi/electron-sdk, so we install with --ignore-scripts to skip the node-gyp
# rebuild (which would otherwise need libx11-dev etc. and slow the job down).
on:
  pull_request:

concurrency:
  group: ci-electron-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (eslint)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned patch for reproducibility.
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies (skip native rebuild)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
