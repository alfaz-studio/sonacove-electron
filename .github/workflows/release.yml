name: Release (on tag)

# Cut a production release by pushing a version tag — merging to main no longer
# builds or releases anything (that was the per-merge Windows+macOS cost). The
# TAG is the source of truth for the version: it's read at build time and
# injected into electron-builder, so nothing is ever committed back to git
# (no version-bump commit, no [skip ci], no push-with-token).
#
# To release:
#   • GitHub UI:  Releases → Draft new release → choose tag `vX.Y.Z` → Publish, or
#   • Terminal:   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Ensure a (draft) release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # If the tag was created via the Releases UI the release already
          # exists — leave it as-is. Otherwise create a draft to publish later.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it untouched."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Version $VERSION" \
              --notes "Automatically generated draft release." \
              --draft
          fi

  build:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # A release ships every platform. `os` stays as the platform KEY for the
        # downstream `matrix.os == …` step conditions; `runner` is the actual
        # Blacksmith machine. (The app no longer has native node-gyp deps, so the
        # Windows runner no longer needs a specific VS Build Tools version.)
        include:
          - os: windows-2022
            runner: blacksmith-4vcpu-windows-2025
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned patch for reproducible builds (was floating '22').
          node-version: '22.12.0'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: Install Dependencies
        run: npm ci

      # The marketing version comes from the tag (v1.4.2 → 1.4.2) and is passed
      # to electron-builder via --config.extraMetadata.version, so package.json
      # is never modified or committed.
      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build without publishing (Windows)
        if: matrix.os == 'windows-2022'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: npm run dist -- --publish=never --config.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Build and publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --config.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Regenerate and upload latest.yml (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $file = "dist\Sonacove-Meets-Setup.exe"
          $hash = Get-FileHash -Path $file -Algorithm SHA512
          $sha512 = $hash.Hash.ToLower()
          $size = (Get-Item $file).Length
          $version = $env:VERSION
          $date = Get-Date -Format "yyyy-MM-dd"

          Write-Host "Generating latest.yml"
          Write-Host "SHA512: $sha512"

          $yaml = "version: $version`nfiles:`n  - url: Sonacove-Meets-Setup.exe`n    sha512: $sha512`n    size: $size`npath: Sonacove-Meets-Setup.exe`nsha512: $sha512`nreleaseDate: '$date'"

          Set-Content -Path "dist/latest.yml" -Value $yaml

          Write-Host ""
          Write-Host "=== Generated latest.yml ==="
          Get-Content "dist/latest.yml"
          Write-Host ""

          Write-Host "Uploading to release: $env:TAG_NAME"

          gh release upload $env:TAG_NAME --clobber dist/Sonacove-Meets-Setup.exe
          gh release upload $env:TAG_NAME --clobber dist/Sonacove-Meets-Setup.exe.blockmap
          gh release upload $env:TAG_NAME --clobber dist/latest.yml

          Write-Host "Upload complete!"

      - name: Verify mac universal and notarization
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach -quiet -mountpoint /Volumes/SonacoveMeets "dist/Sonacove Meets.dmg"
          file "/Volumes/SonacoveMeets/Sonacove Meets.app/Contents/MacOS/Sonacove Meets"
          codesign --verify --deep --strict "/Volumes/SonacoveMeets/Sonacove Meets.app"
          spctl --assess --type execute --verbose "/Volumes/SonacoveMeets/Sonacove Meets.app" || true
          hdiutil detach -quiet /Volumes/SonacoveMeets
