name: Build Staging Launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      platform:
        description: "Platform(s) to build"
        required: true
        type: choice
        options:
          - mac
          - win
          - all

jobs:
  setup:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Build matrix from requested platform
        id: m
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          INCLUDES=""
          if [ "$PLATFORM" = "win" ] || [ "$PLATFORM" = "all" ]; then
            INCLUDES="${INCLUDES}{\"os\":\"windows-2022\",\"runner\":\"blacksmith-4vcpu-windows-2025\"},"
          fi
          if [ "$PLATFORM" = "mac" ] || [ "$PLATFORM" = "all" ]; then
            INCLUDES="${INCLUDES}{\"os\":\"macos-latest\",\"runner\":\"blacksmith-6vcpu-macos-latest\"},"
          fi
          echo "matrix={\"include\":[${INCLUDES%,}]}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      # Dynamic matrix — only the requested platform(s) build. The launcher has
      # no native deps (electron-updater only), so the VS toolchain is
      # irrelevant here.
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned patch for reproducible builds (was floating '22').
          node-version: '22.12.0'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-launcher-${{ matrix.os }}-${{ hashFiles('staging-launcher/package.json') }}
          restore-keys: |
            electron-launcher-${{ matrix.os }}-

      - name: Install launcher dependencies
        working-directory: staging-launcher
        run: npm install

      - name: Set version
        working-directory: staging-launcher
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build launcher (Windows)
        if: matrix.os == 'windows-2022'
        working-directory: staging-launcher
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: npx electron-builder --publish=never

      - name: Build launcher (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: staging-launcher
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish=never

      - name: Upload to versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="launcher-v${{ inputs.version }}"

          # Create release if it doesn't exist
          gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null || \
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Staging Launcher v${{ inputs.version }}" \
            --notes "Sonacove Staging Launcher - install once to test PR builds." \
            --latest=false

          # Upload built artifacts
          cd staging-launcher/dist
          for f in *.exe *.dmg *.zip; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "${TAG}" "$f" --clobber --repo "${{ github.repository }}"
            fi
          done

      - name: Upload to auto-update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Also upload to the "staging-launcher" tag that electron-updater
          # checks (publish.url in package.json). This ensures signed builds
          # become the auto-update source of truth.
          TAG="staging-launcher"

          gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null || \
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Sonacove Staging Launcher" \
            --notes "Download the Staging Launcher to browse, download, and run PR builds." \
            --latest=false

          cd staging-launcher/dist
          for f in *.exe *.dmg *.zip latest.yml latest-mac.yml; do
            if [ -f "$f" ]; then
              echo "Uploading to ${TAG}: $f"
              gh release upload "${TAG}" "$f" --clobber --repo "${{ github.repository }}"
            fi
          done
