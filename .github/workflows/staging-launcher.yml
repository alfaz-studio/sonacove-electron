name: Staging Launcher

# Manual only — no longer auto-builds on every push to `staging-launcher/**`.
# Run from the Actions tab and pick the platform(s) to rebuild the launcher.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        required: true
        type: choice
        options:
          - mac
          - win
          - all

jobs:
  setup:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Build matrix from requested platform
        id: m
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          INCLUDES=""
          if [ "$PLATFORM" = "win" ] || [ "$PLATFORM" = "all" ]; then
            INCLUDES="${INCLUDES}{\"os\":\"windows-2022\",\"runner\":\"blacksmith-4vcpu-windows-2025\"},"
          fi
          if [ "$PLATFORM" = "mac" ] || [ "$PLATFORM" = "all" ]; then
            INCLUDES="${INCLUDES}{\"os\":\"macos-latest\",\"runner\":\"blacksmith-6vcpu-macos-latest\"},"
          fi
          echo "matrix={\"include\":[${INCLUDES%,}]}" >> "$GITHUB_OUTPUT"

  create-release:
    needs: setup
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="staging-launcher"
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "Sonacove Staging Launcher" \
              --notes "Download the Staging Launcher to browse, download, and run PR builds.

          Updated automatically when \`staging-launcher/\` changes on main." \
              --latest=false
          fi

  build-launcher:
    needs: [setup, create-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Dynamic matrix — only the requested platform(s) build. The launcher has
      # no native deps (electron-updater only), so the VS toolchain is
      # irrelevant here.
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned patch for reproducible builds (was floating '22').
          node-version: '22.12.0'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-launcher-${{ matrix.os }}-${{ hashFiles('staging-launcher/package.json') }}
          restore-keys: |
            electron-launcher-${{ matrix.os }}-

      - name: Bump version for auto-update detection
        working-directory: staging-launcher
        shell: bash
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Version bumped to:', pkg.version);
          "

      - name: Install launcher dependencies
        working-directory: staging-launcher
        run: npm install

      - name: Build launcher (Windows)
        if: matrix.os == 'windows-2022'
        working-directory: staging-launcher
        run: npx electron-builder --win --publish never

      - name: Build launcher (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: staging-launcher
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS signing and notarization
        if: matrix.os == 'macos-latest'
        run: |
          DMG=$(ls staging-launcher/dist/*.dmg | head -1)
          echo "Verifying: $DMG"
          hdiutil attach -quiet -mountpoint /Volumes/StagingLauncher "$DMG"
          APP=$(ls -d /Volumes/StagingLauncher/*.app | head -1)
          echo "App: $APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose "$APP"
          hdiutil detach -quiet /Volumes/StagingLauncher

      - name: Rename installers (spaces → dots)
        shell: bash
        run: |
          # gh release upload replaces spaces with dots in asset names,
          # but latest.yml references the original filenames (with spaces).
          # Rename local files to use dots and patch the yml manifests to match.
          cd staging-launcher/dist
          for f in *.exe *.dmg; do
            [ -f "$f" ] || continue
            newname="${f// /.}"
            if [ "$f" != "$newname" ]; then
              echo "Renaming: '$f' → '$newname'"
              mv "$f" "$newname"
            fi
          done

          # Patch latest.yml and latest-mac.yml — replace ALL spaces in
          # filenames so the manifest matches the renamed files on disk.
          for yml in latest.yml latest-mac.yml; do
            [ -f "$yml" ] || continue
            node -e "
              const fs = require('fs');
              let y = fs.readFileSync('$yml','utf8');
              // Replace spaces with dots in filename references (.exe / .dmg lines)
              y = y.replace(/^(\s*-?\s*(?:url|path):\s*)(.+)/gm, (_, prefix, rest) =>
                prefix + rest.replace(/ /g, '.'));
              fs.writeFileSync('$yml', y);
            "
            echo "Patched $yml:"
            cat "$yml"
          done

      - name: List build output
        shell: bash
        run: ls -lhR staging-launcher/dist/ || true

      - name: Upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="staging-launcher"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          # Update release notes with latest commit
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --notes "Download the Staging Launcher to browse, download, and run PR builds.

          **Latest:** ${SHORT_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))

          Updated automatically when \`staging-launcher/\` changes on main."

          # Delete old versioned assets for THIS PLATFORM only.
          # Each platform cleans its own installer type to avoid a race
          # condition where the slower job deletes the faster job's upload.
          echo "Cleaning old assets..."
          if [ "$RUNNER_OS" = "Windows" ]; then
            PATTERN="*.exe"
          else
            PATTERN="*.dmg"
          fi
          gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              $PATTERN) echo "Deleting old asset: $asset"
                        gh release delete-asset "${TAG}" "$asset" --repo "${{ github.repository }}" -y ;;
            esac
          done

          # Upload platform installers
          for f in staging-launcher/dist/*.exe staging-launcher/dist/*.dmg; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "${TAG}" "$f" --repo "${{ github.repository }}"
            fi
          done

          # Upload electron-updater manifests (clobber to overwrite)
          for f in staging-launcher/dist/latest.yml staging-launcher/dist/latest-mac.yml; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "${TAG}" "$f" --clobber --repo "${{ github.repository }}"
            fi
          done
