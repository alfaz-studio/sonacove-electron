name: Staging Build (manual)

# Intentional, on-demand staging builds — they no longer run automatically on
# every PR commit (Windows + macOS electron builds are the most expensive jobs
# on our Blacksmith bill). Trigger one of two ways:
#
#   • Comment `/build <platform>` on a PR — platform is REQUIRED:
#       /build mac      → macOS only
#       /build win      → Windows only        (alias: windows)
#       /build all      → both
#       /build mac win  → both (explicit)
#     A bare `/build` with no platform posts a usage hint and does nothing, so
#     the 6 vCPU macOS runner only spins up when explicitly asked for.
#
#   • Actions tab → "Staging Build (manual)" → Run workflow → pick a PR number
#     and platform.
#
# Cleanup of closed-PR releases is handled by cleanup-stale-staging.yml.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
      platform:
        description: "Platform(s) to build"
        required: true
        type: choice
        options:
          - mac
          - win
          - all

# A newer /build on the same PR cancels an in-progress build.
concurrency:
  group: staging-build-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  setup:
    # Gate: manual dispatch, OR a `/build` comment on a PR from an authorized
    # user (protects secrets — forks/outside contributors can't trigger builds).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/build') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
    steps:
      - name: Acknowledge the command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='eyes' >/dev/null 2>&1 || true

      - name: Resolve PR + platform → build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          # Untrusted PR-comment text — kept in an env var (never interpolated
          # into the script body) to avoid shell injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PR: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # --- Determine the platform spec and PR number from the trigger ---
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SPEC="$INPUT_PLATFORM"
            PR_NUM="$INPUT_PR"
          else
            # Strip the leading "/build" and keep the rest of the first line.
            BODY=$(printf '%s' "$COMMENT_BODY" | head -n1)
            SPEC=$(printf '%s' "$BODY" | sed -E 's@^/build@@' | tr '[:upper:]' '[:lower:]' | xargs || true)
            PR_NUM="$ISSUE_NUMBER"
          fi

          # --- Parse the spec into platform flags ---
          WANT_MAC=false; WANT_WIN=false
          for tok in $SPEC; do
            case "$tok" in
              all)            WANT_MAC=true; WANT_WIN=true ;;
              mac|macos|osx)  WANT_MAC=true ;;
              win|windows)    WANT_WIN=true ;;
              *) ;;  # ignore unknown tokens
            esac
          done

          if [ "$WANT_MAC" = false ] && [ "$WANT_WIN" = false ]; then
            echo "::error::No valid platform specified (got: '$SPEC')."
            if [ "${{ github.event_name }}" = "issue_comment" ]; then
              gh pr comment "$PR_NUM" --repo "$REPO" --body \
                "⚠️ Specify a platform: \`/build mac\`, \`/build win\`, or \`/build all\`." || true
            fi
            exit 1
          fi

          # --- Build the matrix include list ---
          INCLUDES=""
          if [ "$WANT_WIN" = true ]; then
            INCLUDES="${INCLUDES}{\"os\":\"windows-2022\",\"runner\":\"blacksmith-4vcpu-windows-2025\"},"
          fi
          if [ "$WANT_MAC" = true ]; then
            INCLUDES="${INCLUDES}{\"os\":\"macos-latest\",\"runner\":\"blacksmith-6vcpu-macos-latest\"},"
          fi
          MATRIX="{\"include\":[${INCLUDES%,}]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $MATRIX"

          # --- Resolve PR head SHA + title ---
          PR_JSON=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid,title)
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(printf '%s' "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(printf '%s' "$PR_JSON" | jq -r .title)" >> "$GITHUB_OUTPUT"

  create-staging-release:
    needs: setup
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Create or update staging release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_TITLE: ${{ needs.setup.outputs.pr_title }}
        run: |
          PR_NUM=${{ needs.setup.outputs.pr_number }}
          TAG="staging-pr-${PR_NUM}"
          TITLE="Staging: PR #${PR_NUM} - ${PR_TITLE}"
          SHA="${{ needs.setup.outputs.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          # Create or update the tag
          gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" \
            --method PATCH \
            --field sha="${SHA}" 2>/dev/null || \
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            --field ref="refs/tags/${TAG}" \
            --field sha="${SHA}"

          # Create release if it doesn't exist, or update its title
          if gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
            gh release edit "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --notes "Staging build for PR #${PR_NUM} (commit ${SHORT_SHA})"
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --notes "Staging build for PR #${PR_NUM} (commit ${SHORT_SHA})" \
              --prerelease
          fi

  build-staging:
    needs: [setup, create-staging-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Dynamic matrix — only the requested platform(s) build (see setup job).
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Pinned patch for reproducible builds (was floating '22').
          node-version: '22.12.0'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Patch app identity for staging build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');

            // Change app identity to avoid conflicts with production.
            // Changing 'name' is critical — Electron uses it for the
            // single-instance lock, so without this the staging build
            // would just focus the production window and quit.
            pkg.name = 'sonacove-staging';
            pkg.build.appId = 'com.sonacove.staging';
            pkg.build.productName = 'Sonacove Staging';
            pkg.productName = 'Sonacove Staging';

            // Change protocol to staging variant
            if (pkg.build.protocols && pkg.build.protocols[0]) {
              pkg.build.protocols[0].schemes = ['sonacove-staging'];
            }

            // Remove code signing hooks (staging builds are unsigned)
            delete pkg.build.afterPack;
            delete pkg.build.afterAllArtifactBuild;

            // Windows: portable dir output instead of NSIS installer.
            // Re-enable signAndEditExecutable so electron-builder applies the
            // icon via rcedit (production sets this to false because it uses a
            // custom afterPack signing script which we just removed).
            pkg.build.win.target = 'dir';
            pkg.build.win.signAndEditExecutable = true;
            delete pkg.build.nsis;
            delete pkg.build.win.artifactName;

            // macOS: dir output for each arch separately (universal requires signing)
            pkg.build.mac.target = [
              { target: 'dir', arch: ['x64'] },
              { target: 'dir', arch: ['arm64'] }
            ];
            delete pkg.build.mac.hardenedRuntime;
            delete pkg.build.mac.entitlements;
            delete pkg.build.mac.artifactName;

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Patched package.json for staging build');
            console.log('  name:', pkg.name);
            console.log('  appId:', pkg.build.appId);
            console.log('  productName:', pkg.productName);
            console.log('  win.target:', pkg.build.win.target);
            console.log('  signAndEditExecutable:', pkg.build.win.signAndEditExecutable);
          "

      - name: Build (webpack)
        run: npm run build

      - name: Package portable build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Build both x64 and arm64 dir targets (configured in patched package.json)
            npx electron-builder --mac --x64 --arm64 --publish=never
          else
            npx electron-builder --dir --publish=never
          fi
        env:
          # No signing env vars — intentionally unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Zip portable build (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\win-unpacked\*" -DestinationPath "dist\sonacove-staging-win-x64.zip"
          Write-Host "Created: dist\sonacove-staging-win-x64.zip"
          Write-Host "Size: $((Get-Item 'dist\sonacove-staging-win-x64.zip').Length / 1MB) MB"

      - name: Zip portable build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -e

          # Zip x64 build (output dir is "mac" on x64 hosts, "mac-x64" on arm64 hosts)
          X64_DIR=""
          if [ -d "dist/mac-x64" ]; then
            X64_DIR="dist/mac-x64"
          elif [ -d "dist/mac" ]; then
            X64_DIR="dist/mac"
          fi
          if [ -n "$X64_DIR" ]; then
            cd "$X64_DIR"
            zip -r ../sonacove-staging-mac-x64.zip "Sonacove Staging.app"
            cd ../..
            echo "Created: dist/sonacove-staging-mac-x64.zip (from $X64_DIR)"
          fi

          # Zip arm64 build
          if [ -d "dist/mac-arm64" ]; then
            cd dist/mac-arm64
            zip -r ../sonacove-staging-mac-arm64.zip "Sonacove Staging.app"
            cd ../..
            echo "Created: dist/sonacove-staging-mac-arm64.zip"
          fi

          # Fail if any expected zip is missing
          missing=0
          [ -f "dist/sonacove-staging-mac-x64.zip" ]   || { echo "::error::x64 zip not produced"; missing=1; }
          [ -f "dist/sonacove-staging-mac-arm64.zip" ] || { echo "::error::arm64 zip not produced"; missing=1; }
          [ "$missing" -eq 1 ] && exit 1
          ls -lh dist/sonacove-staging-*.zip

      - name: Upload to staging release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR_NUM=${{ needs.setup.outputs.pr_number }}
          TAG="staging-pr-${PR_NUM}"

          # Upload zip artifacts (clobber existing ones from previous push)
          for f in dist/sonacove-staging-*.zip; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "${TAG}" "$f" --clobber --repo "${{ github.repository }}"
            fi
          done

  comment-on-pr:
    needs: [setup, build-staging]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR with build links
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const tag = `staging-pr-${pr}`;
            const sha = process.env.HEAD_SHA.substring(0, 7);
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;

            const body = [
              `## Staging Build Ready`,
              ``,
              `Commit: \`${sha}\``,
              ``,
              `**[Download staging builds](${releaseUrl})**`,
              ``,
              `| Platform | Asset |`,
              `|----------|-------|`,
              `| Windows x64 | \`sonacove-staging-win-x64.zip\` |`,
              `| macOS x64 (Intel) | \`sonacove-staging-mac-x64.zip\` |`,
              `| macOS arm64 (Apple Silicon) | \`sonacove-staging-mac-arm64.zip\` |`,
              ``,
              `> Only the platform(s) you requested via \`/build\` were built — others may be absent.`,
              ``,
              `Or use the **[Sonacove Staging Launcher](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/staging-launcher)** to download and run automatically.`,
            ].join('\n');

            // Find and update existing bot comment, or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const botComment = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('## Staging Build Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
