name: Diagnose Win sign-tool path resolution

# Diagnostic-only workflow to confirm the hypothesis that cmd.exe on
# windows-2022 resolves `sign` to our project's `code-signing.js` (or
# previously `sign.js`) via PATHEXT/cwd-first lookup, which then runs
# under wscript and hangs the release job forever.
#
# Delete this file once the diagnosis is confirmed and the rename ships.

on:
  push:
    branches: [ fix/windows-sign-collision ]
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Show what `sign` resolves to on this runner
        shell: cmd
        run: |
          echo === where sign (system-wide) ===
          where sign 2>&1
          echo.
          echo === where sign from cwd (no shell PATH override) ===
          cd
          dir sign*
          echo.
          echo === PATHEXT ===
          set PATHEXT
          echo.
          echo === NoDefaultCurrentDirectoryInExePath ===
          set NoDefault 2>&1
          echo.
          echo === Runner image metadata ===
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
