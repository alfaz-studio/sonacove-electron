<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participants</title>
  <link rel="stylesheet" href="participant-panel.css">
</head>
<body>
  <!-- Spotlight PiP (ui_kits/desktop-overlay/pip-concepts.html → ConceptSpotlight):
       one focused tile, a layout switch (single / split / grid), an Auto/Pinned
       speaker-follow toggle, and (single only) a filmstrip of everyone. -->
  <div class="sp-card" id="card">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <div class="sp-header" id="header">
      <!-- layout segmented control -->
      <span class="sp-seg" id="layoutSeg">
        <button class="sp-seg-btn" data-layout="single" data-tip="Spotlight"></button>
        <button class="sp-seg-btn" data-layout="split" data-tip="Split"></button>
        <button class="sp-seg-btn" data-layout="grid" data-tip="Grid"></button>
      </span>

      <!-- Auto / Pinned speaker-follow toggle -->
      <button class="sp-auto" id="autoBtn"></button>

      <span class="sp-spacer"></span>

      <!-- participant count -->
      <span class="sp-count" id="count" data-tip="Participants"></span>

      <span class="sp-hdiv"></span>

      <!-- minimize to pill · back to meeting -->
      <button class="sp-ctrl" id="closeBtn" data-tip="Minimize"></button>
      <button class="sp-ctrl" id="backBtn" data-tip="Back to meeting"></button>
    </div>

    <!-- ── Body (layout-dependent) ────────────────────────────────────────── -->
    <div class="sp-body" id="body"></div>
  </div>

  <!-- ── Pill (minimized) ─────────────────────────────────────────────────── -->
  <div class="pill-overlay" id="pillOverlay">
    <button class="pill-btn" id="pillBtn" title="Show participants">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="pill-badge hidden" id="pillBadge">0</span>
    </button>
  </div>

  <script src="participant-panel.js"></script>
</body>
</html>
