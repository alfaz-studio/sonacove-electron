<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participants</title>
  <link rel="stylesheet" href="participant-panel.css">
</head>
<body>
  <div class="panel resize-horizontal" id="panel">
    <!-- Resize edge zones -->
    <div class="resize-edge resize-edge-left" data-edge="left"></div>
    <div class="resize-edge resize-edge-right" data-edge="right"></div>
    <div class="resize-edge resize-edge-top" data-edge="top"></div>
    <div class="resize-edge resize-edge-bottom" data-edge="bottom"></div>

    <!-- Control Bar -->
    <div class="control-bar">
      <div class="control-left">
        <span id="gripIcon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="1"/><circle cx="19" cy="9" r="1"/><circle cx="5" cy="9" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="19" cy="15" r="1"/><circle cx="5" cy="15" r="1"/></svg>
        </span>
        <span class="participant-count" id="participantCount">0 participants</span>
      </div>
      <div class="control-right">
        <button class="ctrl-btn" id="toggleBtn" title="Toggle layout" style="display: none;">
          <span id="toggleIcon">
            <svg width="15" height="15" viewBox="2 2 20 20" fill="currentColor"><path d="M6.227 2.071c-.275.146-.471.512-.435.805.041.284.174.471.512.718.165.114.284.229.261.242-.018.018-.137.073-.265.119-.366.128-1.052.503-1.46.787-.535.38-1.326 1.19-1.67 1.706-.777 1.167-1.166 2.347-1.17 3.573 0 .613 0 .622.133.792.503.663 1.491.288 1.491-.572 0-.402.128-1.116.275-1.564.439-1.313 1.372-2.37 2.653-3.006.206-.105.384-.178.394-.169.013.014-.083.183-.211.38-.233.357-.238.366-.219.659.018.357.137.549.425.686.247.119.504.114.755-.014.183-.091.297-.233 1.039-1.312.837-1.226.96-1.464.901-1.729-.082-.357-.197-.462-1.432-1.304-.654-.444-1.244-.832-1.308-.855-.197-.073-.453-.05-.668.06"/><path d="M13.089 4.852c-.302.041-.64.165-.942.339-.288.165-6.802 6.674-7.031 7.022-.247.38-.357.737-.384 1.217-.023.503.036.819.247 1.258.151.316.274.453 1.93 2.118 1.043 1.048 1.88 1.848 2.036 1.954.43.279.796.384 1.358.384.567 0 .943-.11 1.364-.389.151-.105 1.66-1.583 3.627-3.554 3.111-3.12 3.376-3.399 3.514-3.683.389-.81.348-1.706-.11-2.461-.1-.165-.782-.874-1.953-2.04-1.999-1.985-2.04-2.018-2.772-2.15-.393-.069-.508-.069-.883-.014"/><path d="M20.952 12.853c-.357.105-.585.448-.585.874 0 .631-.238 1.619-.531 2.2-.348.695-.961 1.423-1.597 1.903-.334.247-1.148.682-1.198.636-.014-.014.045-.128.137-.247.242-.334.306-.49.306-.746 0-.48-.352-.823-.837-.823-.389 0-.485.1-1.39 1.418-.453.668-.851 1.29-.883 1.386-.06.206-.028.398.105.64.078.138.338.339 1.235.957 1.39.956 1.404.961 1.711.938.517-.037.864-.517.741-1.02-.06-.234-.22-.417-.567-.654-.224-.156-.229-.156-.114-.202 1.02-.412 1.802-.92 2.521-1.633 1.221-1.217 1.916-2.758 1.994-4.414.023-.54.018-.613-.069-.778-.114-.229-.228-.334-.452-.416-.197-.069-.343-.073-.526-.019"/></svg>
          </span>
        </button>
        <button class="ctrl-btn" id="chatBtn" title="Back to meeting" style="position: relative;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/><path d="m21 3-9 9"/><path d="M15 3h6v6"/></svg>
            <span class="chat-badge-count hidden" id="chatBadgeCount">0</span>
        </button>
        <button class="ctrl-btn ctrl-btn-danger" id="endMeetingBtn" title="End meeting">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 2.59 3.4Z"/><line x1="20" x2="4" y1="4" y2="20" stroke="currentColor" stroke-width="2.5"/></svg>
        </button>
        <button class="ctrl-btn" id="closeBtn" title="Minimize to pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Tiles -->
    <div class="tiles-container" id="tilesContainer"></div>
  </div>

  <!-- Pill -->
  <div class="pill-overlay" id="pillOverlay">
    <button class="pill-btn" id="pillBtn" title="Show Participants">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="pill-badge hidden" id="pillBadge">0</span>
    </button>
  </div>

  <script>
    (function () {
      // ── Icons ──────────────────────────────────────────────────────────────

      var GRIP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg>';
      // Phone-rotate ("auto-rotate") icon — same glyph for both layout states;
      // only the button tooltip changes to describe the next orientation.
      var TOGGLE_ICON = '<svg width="15" height="15" viewBox="2 2 20 20" fill="currentColor"><path d="M6.227 2.071c-.275.146-.471.512-.435.805.041.284.174.471.512.718.165.114.284.229.261.242-.018.018-.137.073-.265.119-.366.128-1.052.503-1.46.787-.535.38-1.326 1.19-1.67 1.706-.777 1.167-1.166 2.347-1.17 3.573 0 .613 0 .622.133.792.503.663 1.491.288 1.491-.572 0-.402.128-1.116.275-1.564.439-1.313 1.372-2.37 2.653-3.006.206-.105.384-.178.394-.169.013.014-.083.183-.211.38-.233.357-.238.366-.219.659.018.357.137.549.425.686.247.119.504.114.755-.014.183-.091.297-.233 1.039-1.312.837-1.226.96-1.464.901-1.729-.082-.357-.197-.462-1.432-1.304-.654-.444-1.244-.832-1.308-.855-.197-.073-.453-.05-.668.06"/><path d="M13.089 4.852c-.302.041-.64.165-.942.339-.288.165-6.802 6.674-7.031 7.022-.247.38-.357.737-.384 1.217-.023.503.036.819.247 1.258.151.316.274.453 1.93 2.118 1.043 1.048 1.88 1.848 2.036 1.954.43.279.796.384 1.358.384.567 0 .943-.11 1.364-.389.151-.105 1.66-1.583 3.627-3.554 3.111-3.12 3.376-3.399 3.514-3.683.389-.81.348-1.706-.11-2.461-.1-.165-.782-.874-1.953-2.04-1.999-1.985-2.04-2.018-2.772-2.15-.393-.069-.508-.069-.883-.014"/><path d="M20.952 12.853c-.357.105-.585.448-.585.874 0 .631-.238 1.619-.531 2.2-.348.695-.961 1.423-1.597 1.903-.334.247-1.148.682-1.198.636-.014-.014.045-.128.137-.247.242-.334.306-.49.306-.746 0-.48-.352-.823-.837-.823-.389 0-.485.1-1.39 1.418-.453.668-.851 1.29-.883 1.386-.06.206-.028.398.105.64.078.138.338.339 1.235.957 1.39.956 1.404.961 1.711.938.517-.037.864-.517.741-1.02-.06-.234-.22-.417-.567-.654-.224-.156-.229-.156-.114-.202 1.02-.412 1.802-.92 2.521-1.633 1.221-1.217 1.916-2.758 1.994-4.414.023-.54.018-.613-.069-.778-.114-.229-.228-.334-.452-.416-.197-.069-.343-.073-.526-.019"/></svg>';
      var USER_FALLBACK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      var MIC_ON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>';
      var MIC_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>';
      var VIDEO_ON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>';
      var VIDEO_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.66 5H14a2 2 0 0 1 2 2v2.34l1 1L22 7v10"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
      var HAND_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>';
      var PIN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';

      // ── State ──────────────────────────────────────────────────────────────

      var currentOrientation = 'horizontal';
      var participants = [];
      var totalParticipantCount = 0;
      var lastUnreadCount = 0;
      var visibleTileCount = 4;
      var resizeEdge = null; // which edge is being dragged — determines slice direction
      // { participantId: true } — local pinned by default.
      // The jitsi-meet renderer uses 'local' as the local participant's ID
      // (see usePiPParticipants.ts), so this key survives the cleanup loop.
      // ⚠️ If jitsi-meet changes the local ID from 'local', this default breaks.
      var pinnedIds = { local: true };
      var isPillMode = false;
      var DRAG_THRESHOLD = 5;
      var AUDIO_LEVEL_DOTS = 5;
      var AUDIO_LEVEL_SENSITIVITY = 1.2;

      // ── Per-video tile sizing ───────────────────────────────────────────────
      // Each tile follows its video's aspect ratio so a portrait phone video
      // shows portrait instead of being cropped into a landscape strip. The
      // cross axis is fixed per orientation (tile height in horizontal, tile
      // width in vertical); the main axis follows the AR, clamped. The MIN is a
      // normal (no-video) tile — derived from DEFAULT_AR below — so a tile never
      // shrinks below the default tile size; portrait/wide videos only ever grow
      // the main axis past it. (Tiles are sized from the AR alone, never the
      // window size, and never flex-shrink, so a small screen can't shrink them.)
      var TILE_GAP = 8;          // matches .tiles-container gap + main TILE_GAP
      var H_TILE_H = 130;        // horizontal: fixed tile height (cross axis)
      var V_TILE_W = 250;        // vertical: fixed tile width (cross axis)
      var DEFAULT_AR = 16 / 9;   // no-video / not-yet-known tiles = a "normal" tile
      // Floors = a normal tile's main-axis size. Caps allow growth past it.
      var H_MIN_W = Math.round(H_TILE_H * DEFAULT_AR), H_MAX_W = 320;  // horizontal: tile width
      var V_MIN_H = Math.round(V_TILE_W / DEFAULT_AR), V_MAX_H = 360;  // vertical: tile height

      // { participantId: aspectRatio } — last AR seen in a frame, drives tile shape.
      var arById = {};

      // ── DOM refs ───────────────────────────────────────────────────────────

      var panel = document.getElementById('panel');
      var tilesContainer = document.getElementById('tilesContainer');
      var toggleBtn = document.getElementById('toggleBtn');
      var toggleIcon = document.getElementById('toggleIcon');
      var gripIcon = document.getElementById('gripIcon');
      var participantCountEl = document.getElementById('participantCount');
      var pillOverlay = document.getElementById('pillOverlay');
      var pillBtn = document.getElementById('pillBtn');
      var pillBadge = document.getElementById('pillBadge');
      var chatBtn = document.getElementById('chatBtn');
      var chatBadgeCount = document.getElementById('chatBadgeCount');

      // macOS: match pill shape to the native rounded-square window background.
      if (window.panelPlatform === 'darwin') {
        pillBtn.classList.add('macos');
      }

      // ── Tile rendering ─────────────────────────────────────────────────────

      // Tile box dimensions for a given video aspect ratio in the current
      // orientation. The cross axis is fixed; the main axis follows the AR
      // (clamped). The video is shown object-fit:contain inside, so it's never
      // cropped — at the clamp extremes a small letterbox/pillarbox bar shows.
      function tileDimsFor(ar) {
        var a = (typeof ar === 'number' && isFinite(ar) && ar > 0) ? ar : DEFAULT_AR;

        if (currentOrientation === 'vertical') {
          var h = Math.max(V_MIN_H, Math.min(V_MAX_H, Math.round(V_TILE_W / a)));
          return { w: V_TILE_W, h: h, main: h };
        }

        var w = Math.max(H_MIN_W, Math.min(H_MAX_W, Math.round(H_TILE_H * a)));
        return { w: w, h: H_TILE_H, main: w };
      }

      // Applies the AR-derived box size to a tile element.
      function sizeTile(tile, id) {
        var d = tileDimsFor(arById[id]);
        tile.style.width = d.w + 'px';
        tile.style.height = d.h + 'px';
      }

      // Reports the visible tiles' main-axis extent to main so it can fit the
      // window. rAF-debounced and value-deduped to avoid setBounds churn.
      var contentReportScheduled = false;
      var lastReportedMain = -1;

      function scheduleContentReport() {
        if (contentReportScheduled) {
          return;
        }
        contentReportScheduled = true;
        requestAnimationFrame(function () {
          contentReportScheduled = false;
          reportContentSizeNow();
        });
      }

      function reportContentSizeNow() {
        if (isPillMode) {
          return;
        }

        var tiles = tilesContainer.querySelectorAll('.tile');
        var n = tiles.length;

        if (!n) {
          return;
        }

        var sum = 0;
        for (var i = 0; i < n; i++) {
          sum += tileDimsFor(arById[tiles[i].getAttribute('data-participant-id')]).main;
        }

        var mainExtent = sum + ((n - 1) * TILE_GAP);

        if (Math.abs(mainExtent - lastReportedMain) < 2) {
          return;
        }
        lastReportedMain = mainExtent;

        window.panelAPI.reportContentSize({
          orientation: currentOrientation,
          mainExtent: mainExtent,
          avgTileMain: Math.round(sum / n),
          count: n
        });
      }

      function getVisibleParticipants() {
        if (visibleTileCount >= participants.length) {
          return participants.slice();
        }

        // Pinned participants are always shown. Fill remaining slots
        // from unpinned, respecting the resize-edge direction.
        var pinned = [];
        var unpinned = [];
        for (var i = 0; i < participants.length; i++) {
          if (pinnedIds[participants[i].id]) {
            pinned.push(participants[i]);
          } else {
            unpinned.push(participants[i]);
          }
        }

        var slotsLeft = Math.max(0, visibleTileCount - pinned.length);
        var hideFromStart = resizeEdge === 'left' || resizeEdge === 'top';
        var fillers = hideFromStart
          ? unpinned.slice(unpinned.length - slotsLeft)
          : unpinned.slice(0, slotsLeft);

        // Merge back in original order.
        var visibleSet = {};
        for (var j = 0; j < pinned.length; j++) visibleSet[pinned[j].id] = true;
        for (var k = 0; k < fillers.length; k++) visibleSet[fillers[k].id] = true;

        var result = [];
        for (var m = 0; m < participants.length; m++) {
          if (visibleSet[participants[m].id]) result.push(participants[m]);
        }
        return result;
      }

      function renderTiles() {
        var visible = getVisibleParticipants();

        var existingTiles = tilesContainer.querySelectorAll('.tile');
        var existingMap = {};
        for (var i = 0; i < existingTiles.length; i++) {
          existingMap[existingTiles[i].getAttribute('data-participant-id')] = existingTiles[i];
        }

        var newIds = {};
        for (var j = 0; j < visible.length; j++) {
          newIds[visible[j].id] = true;
        }

        for (var id in existingMap) {
          if (!newIds[id]) {
            existingMap[id].remove();
            delete existingMap[id];
            delete arById[id];   // drop stale AR so it can't accumulate across join/leave cycles
          }
        }

        for (var k = 0; k < visible.length; k++) {
          var p = visible[k];
          var tile = existingMap[p.id];

          if (!tile) {
            tile = createTile(p);
            existingMap[p.id] = tile;
            tilesContainer.appendChild(tile);
          } else {
            updateTile(tile, p);
          }
        }

        // Reorder DOM nodes to match the ranked `visible` order (dominant
        // speaker first, etc.). Only when the order actually changed — moving
        // nodes is a layout cost we don't want on every metadata tick, and the
        // entry animation is guarded by the one-shot tile-enter class above.
        var domTiles = tilesContainer.querySelectorAll('.tile');
        var orderChanged = false;
        for (var d = 0; d < visible.length; d++) {
          if (!domTiles[d] || domTiles[d].getAttribute('data-participant-id') !== visible[d].id) {
            orderChanged = true;
            break;
          }
        }
        if (orderChanged) {
          for (var r = 0; r < visible.length; r++) {
            // Guard: a ranked id without a created tile (e.g. visible not yet a
            // strict subset of participants) would appendChild(undefined).
            if (existingMap[visible[r].id]) {
              tilesContainer.appendChild(existingMap[visible[r].id]);
            }
          }
        }

        // Tiles vary in size per video — tell main the new content extent so it
        // can fit the window.
        scheduleContentReport();
      }

      function createTile(p) {
        var tile = document.createElement('div');
        tile.className = 'tile tile-enter';
        tile.setAttribute('data-participant-id', p.id);
        sizeTile(tile, p.id);
        tile.addEventListener('animationend', function () {
          tile.classList.remove('tile-enter');
        });

        var videoImg = document.createElement('img');
        videoImg.className = 'tile-video';
        videoImg.draggable = false;
        videoImg.alt = '';
        tile.appendChild(videoImg);

        var avatarDiv = document.createElement('div');
        avatarDiv.className = 'tile-avatar';
        tile.appendChild(avatarDiv);

        // Audio level dots.
        var audioIndicator = document.createElement('div');
        audioIndicator.className = 'tile-audio-indicator';
        for (var d = 0; d < AUDIO_LEVEL_DOTS; d++) {
          var dot = document.createElement('span');
          dot.className = 'tile-audio-dot';
          audioIndicator.appendChild(dot);
        }
        tile.appendChild(audioIndicator);

        // Pin button — top-left.
        var pinBtn = document.createElement('button');
        pinBtn.className = 'tile-pin-btn' + (pinnedIds[p.id] ? ' pinned' : '');
        pinBtn.title = pinnedIds[p.id] ? 'Unpin' : 'Pin';
        pinBtn.setAttribute('data-id', p.id);
        pinBtn.innerHTML = PIN_ICON;
        pinBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var pid = this.getAttribute('data-id');
          if (pinnedIds[pid]) {
            delete pinnedIds[pid];
          } else {
            pinnedIds[pid] = true;
          }
          window.panelAPI.updatePinState(pinnedIds);
          renderTiles();
        });
        tile.appendChild(pinBtn);

        var nameSpan = document.createElement('span');
        nameSpan.className = 'tile-name';
        tile.appendChild(nameSpan);
        var statusIcons = document.createElement('div');
        statusIcons.className = 'tile-status-icons';
        tile.appendChild(statusIcons);

        updateTile(tile, p);
        return tile;
      }

      function updateTile(tile, p) {
        var videoImg = tile.querySelector('.tile-video');
        var avatarDiv = tile.querySelector('.tile-avatar');
        var nameSpan = tile.querySelector('.tile-name');
        var statusIcons = tile.querySelector('.tile-status-icons');

        nameSpan.textContent = p.name || '';

        if (!p.hasVideo) {
          videoImg.style.display = 'none';
          avatarDiv.style.display = 'flex';
        }

        renderAvatar(avatarDiv, p);

        // Status icons — local gets clickable buttons, remote gets static icons.
        statusIcons.innerHTML = '';
        if (p.id === 'local') {
          var micBtn = document.createElement('button');
          micBtn.className = 'tile-status-btn';
          micBtn.title = p.hasAudio ? 'Mute microphone' : 'Unmute microphone';
          micBtn.innerHTML = p.hasAudio ? MIC_ON : MIC_OFF;
          micBtn.addEventListener('click', function () {
            window.panelAPI.toggleAudio();
          });
          statusIcons.appendChild(micBtn);

          var camBtn = document.createElement('button');
          camBtn.className = 'tile-status-btn';
          camBtn.title = p.hasVideo ? 'Turn off camera' : 'Turn on camera';
          camBtn.innerHTML = p.hasVideo ? VIDEO_ON : VIDEO_OFF;
          camBtn.addEventListener('click', function () {
            window.panelAPI.toggleVideo();
          });
          statusIcons.appendChild(camBtn);
        } else {
          var micChip = document.createElement('span');
          micChip.className = 'tile-status-btn tile-status-static';
          micChip.innerHTML = p.hasAudio ? MIC_ON : MIC_OFF;
          statusIcons.appendChild(micChip);

          var camChip = document.createElement('span');
          camChip.className = 'tile-status-btn tile-status-static';
          camChip.innerHTML = p.hasVideo ? VIDEO_ON : VIDEO_OFF;
          statusIcons.appendChild(camChip);
        }

        // Speaking indicator.
        if (p.dominantSpeaker) {
          tile.classList.add('speaking');
        } else {
          tile.classList.remove('speaking');
        }

        // Raised hand indicator.
        var existingBadge = tile.querySelector('.tile-hand-badge');
        if (p.raisedHand) {
          tile.classList.add('raised-hand');
          if (!existingBadge) {
            var badge = document.createElement('div');
            badge.className = 'tile-hand-badge';
            badge.innerHTML = HAND_ICON;
            tile.appendChild(badge);
          }
        } else {
          tile.classList.remove('raised-hand');
          if (existingBadge) {
            existingBadge.remove();
          }
        }

        // Audio level dots — same logic as AudioLevelIndicator.tsx.
        var audioDots = tile.querySelectorAll('.tile-audio-dot');
        if (audioDots.length) {
          var rawLevel = p.audioLevel || 0;
          var capped = Math.min(1, rawLevel * AUDIO_LEVEL_SENSITIVITY);
          var stretched = capped * AUDIO_LEVEL_DOTS;
          for (var di = 0; di < audioDots.length; di++) {
            var dist = Math.abs(di - 2);
            audioDots[di].style.opacity = Math.min(1, Math.max(0, stretched - dist));
          }
        }

        // Pin indicator.
        var pinBtn = tile.querySelector('.tile-pin-btn');
        if (pinBtn) {
          if (pinnedIds[p.id]) {
            pinBtn.classList.add('pinned');
            pinBtn.title = 'Unpin';
          } else {
            pinBtn.classList.remove('pinned');
            pinBtn.title = 'Pin';
          }
        }
      }

      function renderAvatar(container, p) {
        container.innerHTML = '';

        if (p.avatarURL) {
          var img = document.createElement('img');
          img.className = 'tile-avatar-img';
          img.src = p.avatarURL;
          img.alt = p.name || '';
          img.onerror = function () {
            container.innerHTML = '';
            appendInitialsOrFallback(container, p);
          };
          container.appendChild(img);
        } else {
          appendInitialsOrFallback(container, p);
        }
      }

      function appendInitialsOrFallback(container, p) {
        if (p.initials) {
          var initialsDiv = document.createElement('div');
          initialsDiv.className = 'tile-avatar-initials';
          initialsDiv.textContent = p.initials;
          initialsDiv.style.backgroundColor = p.avatarColor || '#555';
          container.appendChild(initialsDiv);
        } else {
          var fallback = document.createElement('div');
          fallback.className = 'tile-avatar-fallback';
          fallback.innerHTML = USER_FALLBACK;
          container.appendChild(fallback);
        }
      }

      // ── UI updaters ────────────────────────────────────────────────────────

      function applyOrientation() {
        // The cross and main axes swap between orientations, so a vertical
        // layout's main-axis extent can numerically equal a horizontal one's.
        // Clear the last-reported value so the next report always goes through
        // — the <2px dedupe in reportContentSizeNow would otherwise drop it and
        // leave the window sized for the previous orientation.
        lastReportedMain = -1;

        if (currentOrientation === 'vertical') {
          tilesContainer.classList.add('vertical');
          panel.classList.remove('resize-horizontal');
          panel.classList.add('resize-vertical');
        } else {
          tilesContainer.classList.remove('vertical');
          panel.classList.remove('resize-vertical');
          panel.classList.add('resize-horizontal');
        }

        gripIcon.innerHTML = GRIP_ICON;

        toggleIcon.innerHTML = TOGGLE_ICON;
        document.getElementById('toggleBtn').title = currentOrientation === 'horizontal'
          ? 'Switch to vertical layout'
          : 'Switch to horizontal layout';

        // The cross and main axes swap between orientations, so every tile's box
        // changes shape — re-size them all and report the new extent.
        var tiles = tilesContainer.querySelectorAll('.tile');
        for (var i = 0; i < tiles.length; i++) {
          sizeTile(tiles[i], tiles[i].getAttribute('data-participant-id'));
        }
        scheduleContentReport();
      }

      function updateParticipantCount() {
        var total = totalParticipantCount || participants.length;
        var shown = Math.min(visibleTileCount, participants.length);

        if (shown < total) {
          participantCountEl.textContent = shown + ' of ' + total;
        } else {
          participantCountEl.textContent = total + (total === 1 ? ' participant' : ' participants');
        }

        if (total > 0) {
          pillBadge.textContent = total;
          pillBadge.classList.remove('hidden');
        } else {
          pillBadge.classList.add('hidden');
        }

        // Layout toggle is only meaningful with 2+ tiles. Hide it when the
        // user is alone in the meeting — there's nothing to re-arrange.
        toggleBtn.style.display = total > 1 ? '' : 'none';
      }

      function updateChatBadge(count) {
        if ((lastUnreadCount > 0) !== (count > 0)) {
          chatBtn.title = count > 0 ? 'Open chat' : 'Back to meeting';
        }
        lastUnreadCount = count;

        if (count > 0) {
          chatBadgeCount.textContent = count > 99 ? '99+' : count;
          chatBadgeCount.classList.remove('hidden');
        } else {
          chatBadgeCount.classList.add('hidden');
        }
      }

      // ── Panel API event wiring ─────────────────────────────────────────────

      var initialPinSent = false;

      window.panelAPI.onParticipantsUpdate(function (data) {
        participants = data.participants || [];
        totalParticipantCount = data.totalParticipantCount || participants.length;

        // Send initial pin state (local pinned by default) on first update.
        // Must run before cleanup to avoid wiping the default 'local' pin
        // if participants haven't loaded yet.
        if (!initialPinSent && participants.length > 0) {
          initialPinSent = true;
          window.panelAPI.updatePinState(pinnedIds);
        }

        // Clean up pins for participants who left. If any were removed, push
        // the new pin state to main so currentPinnedCount (the resize floor)
        // and the jitsi renderer's dominant-speaker protection don't keep a
        // ghost pin for someone who's gone.
        var currentIds = {};
        for (var i = 0; i < participants.length; i++) currentIds[participants[i].id] = true;
        var pinsPruned = false;
        for (var pid in pinnedIds) {
          if (!currentIds[pid]) {
            delete pinnedIds[pid];
            pinsPruned = true;
          }
        }
        if (pinsPruned) {
          window.panelAPI.updatePinState(pinnedIds);
        }

        renderTiles();
        updateParticipantCount();
        updateChatBadge(data.unreadChatCount || 0);
      });

      window.panelAPI.onFrame(function (frameData) {
        var tile = tilesContainer.querySelector('.tile[data-participant-id="' + frameData.id + '"]');
        if (!tile) return;

        // Resize the tile to the frame's aspect ratio when it changes (camera
        // flip, device rotation, first frame), then report the new extent.
        if (typeof frameData.ar === 'number' && frameData.ar > 0 && arById[frameData.id] !== frameData.ar) {
          arById[frameData.id] = frameData.ar;
          sizeTile(tile, frameData.id);
          scheduleContentReport();
        }

        var videoImg = tile.querySelector('.tile-video');
        var avatarDiv = tile.querySelector('.tile-avatar');

        videoImg.src = frameData.data;
        videoImg.style.display = 'block';
        avatarDiv.style.display = 'none';
      });

      window.panelAPI.onOrientationChanged(function (orientation) {
        currentOrientation = orientation;
        applyOrientation();
        // Fade the new layout back in (no-op when not mid-switch, e.g. the
        // initial orientation sync on load).
        panel.classList.remove('switching');
      });

      // Host theme → live recolour. Only the base accent/danger/warn colours
      // are sent; participant-panel.css derives the translucent variants
      // (glow/bloom/soft) from these via color-mix.
      window.panelAPI.onThemeUpdate(function (t) {
        if (!t) return;
        var root = document.documentElement.style;
        if (t.accent) root.setProperty('--accent', t.accent);
        if (t.accentHover) root.setProperty('--accent-hover', t.accentHover);
        if (t.danger) root.setProperty('--danger', t.danger);
        if (t.dangerIcon) root.setProperty('--danger-icon', t.dangerIcon);
        if (t.warn) root.setProperty('--warn', t.warn);
      });

      window.panelAPI.onVisibleCountChanged(function (data) {
        visibleTileCount = data.count;
        resizeEdge = data.edge;
        renderTiles();
        updateParticipantCount();
      });

      window.panelAPI.onEnterPillMode(function () {
        isPillMode = true;
        panel.classList.add('hiding');
        setTimeout(function () {
          panel.classList.add('hidden');
          panel.classList.remove('hiding');
          pillOverlay.classList.add('active');
          requestAnimationFrame(function () {
            pillBtn.classList.add('visible');
          });
        }, 200);
      });

      window.panelAPI.onEnterPanelMode(function () {
        isPillMode = false;
        pillBtn.classList.remove('visible');
        setTimeout(function () {
          pillOverlay.classList.remove('active');
          panel.classList.remove('hidden');
          panel.classList.add('hiding');
          requestAnimationFrame(function () {
            panel.classList.remove('hiding');
          });
        }, 200);
      });

      // ── Panel drag ─────────────────────────────────────────────────────────

      var panelDragPending = false;
      var panelDragging = false;
      var panelStartX = 0;
      var panelStartY = 0;

      // The whole panel acts as a drag surface so the window can be moved by
      // grabbing anywhere — tiles, empty space, or the control bar. Mousedowns
      // that land on an interactive control (buttons, pin/status toggles,
      // resize edges) are ignored so those still work as clicks/resizes.
      var DRAG_IGNORE_SELECTOR = '.ctrl-btn, .tile-status-btn, .tile-pin-btn, .resize-edge';

      panel.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        if (e.target.closest(DRAG_IGNORE_SELECTOR)) return;
        panelDragPending = true;
        panelDragging = false;
        panelStartX = e.screenX;
        panelStartY = e.screenY;
        e.preventDefault();
      });

      window.addEventListener('mousemove', function (e) {
        if (!panelDragPending || panelDragging) return;
        var dx = Math.abs(e.screenX - panelStartX);
        var dy = Math.abs(e.screenY - panelStartY);
        if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
          panelDragging = true;
          window.panelAPI.startWindowDrag();
        }
      });

      window.addEventListener('mouseup', function () {
        if (panelDragging) {
          window.panelAPI.stopWindowDrag();
        }
        panelDragPending = false;
        panelDragging = false;
      });

      // ── Pill drag ──────────────────────────────────────────────────────────

      var pillDragging = false;
      var pillStartX = 0;
      var pillStartY = 0;
      var pillMoved = false;

      pillBtn.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        pillDragging = true;
        pillMoved = false;
        pillStartX = e.screenX;
        pillStartY = e.screenY;
        window.panelAPI.startWindowDrag();
        e.preventDefault();
      });

      window.addEventListener('mousemove', function (e) {
        if (!pillDragging || pillMoved) return;
        var dx = Math.abs(e.screenX - pillStartX);
        var dy = Math.abs(e.screenY - pillStartY);
        if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
          pillMoved = true;
        }
      });

      window.addEventListener('mouseup', function () {
        if (!pillDragging) return;
        pillDragging = false;
        window.panelAPI.stopWindowDrag();
        if (!pillMoved) {
          window.panelAPI.reopen();
        }
      });

      // ── Edge resize ───────────────────────────────────────────────────────

      var edgeResizing = false;

      document.querySelectorAll('.resize-edge').forEach(function (edgeEl) {
        edgeEl.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          edgeResizing = true;
          window.panelAPI.startEdgeResize(edgeEl.getAttribute('data-edge'));
          e.preventDefault();
          e.stopPropagation();
        });
      });

      window.addEventListener('mouseup', function () {
        if (edgeResizing) {
          edgeResizing = false;
          window.panelAPI.stopEdgeResize();
        }
      });

      // ── Button handlers ────────────────────────────────────────────────────

      document.getElementById('closeBtn').addEventListener('click', function () {
        window.panelAPI.close();
      });

      document.getElementById('toggleBtn').addEventListener('click', function () {
        // Cross-fade: hide the panel, let the window reshape for the new layout
        // off-screen, then onOrientationChanged fades it back in.
        panel.classList.add('switching');
        // Must stay > the .panel.switching opacity transition (0.15s = 150ms) in
        // participant-panel.css so the reshape happens fully faded out — keep the
        // two in sync if that transition duration is ever tuned.
        setTimeout(function () {
          window.panelAPI.toggleOrientation();
        }, 160);
      });

      document.getElementById('chatBtn').addEventListener('click', function () {
        window.panelAPI.openChat(lastUnreadCount > 0);
      });

      document.getElementById('endMeetingBtn').addEventListener('click', function () {
        window.panelAPI.endMeeting();
      });

      // ── Init ───────────────────────────────────────────────────────────────

      applyOrientation();
      updateParticipantCount();
    })();
  </script>
</body>
</html>
