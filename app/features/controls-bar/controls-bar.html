<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshare controls</title>
  <!-- DM Sans (the jitsi-meet app font) is bundled locally — see @font-face in controls-bar.css. -->
  <link rel="stylesheet" href="controls-bar.css">
</head>
<body>
  <!-- "Thread" concept (ui_kits/desktop-overlay/concepts.html → ConceptThread):
       one slim capsule, status IS the bar. Mark + live timer always lead; a
       compact Stop always trails; the icon-only controls reveal inline on hover. -->
  <div class="cb-root" id="cbRoot">
    <div class="cb-thread" id="cbThread">

      <!-- ── Lead: mangrove mark + live timer (always visible) ───────────── -->
      <span class="cb-lead">
        <span class="cb-mark">
          <span class="cb-mark-ring"></span>
          <span class="cb-mark-chip">
            <svg viewBox="0 0 58 46" width="20" height="16" style="color:#2f9e63">
              <path fill="currentColor" d="M35.333.556c.967 1.716.967 1.716 1.743 3.985l.897 2.482c.452 1.301.898 2.605 1.341 3.91 2.212 6.427 4.296 10.311 10.154 13.842 2.204 1.408 3.58 2.37 4.535 4.864.447 2.055.75 4.08.997 6.167l.313 2.162c.25 1.75.478 3.5.687 5.255l4 .667v1.333H0V43.89h4l.245-2.636c.597-6.279 1.237-12.497 2.422-18.698l1.68-.203c2.271-.393 4.213-.853 6.32-1.797 1.36-2.039 1.598-4.274 2-6.666.625-3.485 1.337-6.378 3.333-9.334 3.95-2.735 10.587-5.845 15.333-4zm-14 5.334c-2.583 4.232-3.607 9.207-4.666 14l8-2c-.667 1.333-.667 1.333-2.13 1.839l-1.91.481-2.071.561c-1.448.383-2.9.755-4.354 1.115-1.954.54-3.727 1.086-5.535 2.004-1.26 2.113-1.26 2.113-1.334 4.666-.139.932-.28 1.864-.422 2.795-.113.97-.222 1.942-.328 2.914l-.174 1.472C6.095 38.507 6 41.07 6 43.89h15.333l.625-4.709c.618-3.711 1.379-5.884 4.5-8.25a46.13 46.13 0 012.875-1.708l1.185.596c1.278.636 2.567 1.251 3.857 1.862 2.647 1.852 3.048 4.399 3.583 7.417l.709 4.792H54l-.792-6.792-.224-2.123-.221-1.697-.201-1.725c-1.213-3.59-4.548-5.487-7.513-7.598-4.441-3.596-6.032-7.828-7.84-13.107-.318-.873-.638-1.745-.96-2.616-.77-2.108-1.519-4.22-2.249-6.342-4.397 0-9.26 1.09-12.667 4z"/>
            </svg>
          </span>
        </span>
        <span class="cb-meta">
          <span class="cb-timer-val">17:12</span>
          <span class="cb-live">
            <span class="cb-live-dot"></span> Live
          </span>
        </span>
      </span>

      <!-- ── Controls: icon-only, revealed on hover ──────────────────────── -->
      <!-- .cb-controls animates its width (grid 0fr→1fr); .cb-controls-inner
           is the clipped flex row. -->
      <span class="cb-controls" id="cbControls">
        <span class="cb-controls-inner" id="cbControlsInner">
        <span class="cb-divider"></span>

        <!-- Each holds both glyphs (on + off); controls-bar.js toggles
             .cb-btn--danger from the live mute state and CSS swaps the icon. -->
        <button class="cb-btn" id="cbAudio" data-tip="Audio">
          <svg class="cb-ico-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg class="cb-ico-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>

        <button class="cb-btn" id="cbVideo" data-tip="Video">
          <svg class="cb-ico-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/></svg>
          <svg class="cb-ico-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.66 6H14a2 2 0 0 1 2 2v2.34l1 1L22 8v8"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2l10 10Z"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>

        <button class="cb-btn" id="cbParticipants" data-tip="Participants">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="cb-badge" id="cbPartBadge" hidden></span>
        </button>

        <button class="cb-btn" id="cbChat" data-tip="Chat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="cb-badge" id="cbChatBadge" hidden></span>
        </button>

        <button class="cb-btn cb-btn--active" data-tip="Annotate">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        </button>

        <div class="cb-more" id="cbMore">
          <button class="cb-btn" id="cbMoreBtn" data-tip="More">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </button>
          <div class="cb-menu" role="menu">
            <button class="cb-menu-item" role="menuitem">
              <span class="cb-menu-icon cb-menu-icon--rec">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>
              </span>
              Record
            </button>
          </div>
        </div>

        <span class="cb-divider"></span>
        </span>
      </span>

      <!-- ── Stop share (always visible) ─────────────────────────────────── -->
      <button class="cb-stop" id="cbStopShare">
        <span class="cb-stop-square"></span> Stop
      </button>
    </div>

    <!-- First-run hint — shown after the intro collapse, dismissed on first hover. -->
    <div class="cb-hint" id="cbHint">Hover to see all controls</div>
  </div>

  <script src="controls-bar.js"></script>
</body>
</html>
